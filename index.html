<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nergal</title>
    <!-- Splash CSS lives in styles/globals.css (bundled, served as an
         external self-hosted stylesheet), NOT inline here. An inline style
         element makes Tauri stamp a nonce into the served CSP style-src,
         which per spec voids the unsafe-inline the CSP intentionally grants,
         silently blocking every runtime-injected stylesheet (Sileo toasts,
         CodeMirror StyleModule). Keeping this file free of inline style
         elements preserves effective unsafe-inline for library styles. -->
  </head>
  <body>
    <div id="root">
      <div id="splash"><div class="dot"></div>loading Nergal...</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
