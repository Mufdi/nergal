name: linux-deps
description: Install the Tauri Linux system dependencies (webkit2gtk, gtk, soup, appindicator, gstreamer)

# Shared between ci.yml and release.yml so the apt list can't drift between
# them (it already drifted from README once) -- the Tauri `-sys` crates need
# these headers to even compile, not just to bundle.
runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libsoup-3.0-dev \
          libappindicator3-dev \
          librsvg2-dev \
          patchelf \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good
